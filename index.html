<style>
:root{
  --navy:#0b1f3a; --blue:#89cff0; --green:#bfe3f7; --ink:#1a2433; --muted:#5d6b7c;
  --bg:#ffffff; --deep:#1f5f9a; --soft:#f3f6f9; --line:#e2e8ee;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.7 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic",Manrope,system-ui,sans-serif}
html[lang="ar"] h1,html[lang="ar"] h2{letter-spacing:0;line-height:1.3}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
@media (max-width:600px){.wrap{padding:0 16px}}

header.top{position:absolute;top:0;left:0;right:0;z-index:20;color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;border-bottom:1px solid rgba(255,255,255,.18);gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:.02em}
.mark{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--blue) 0 50%,var(--green) 50% 100%);display:grid;place-items:center;flex:none}
.mark::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--navy)}
.right{display:flex;align-items:center;gap:32px}
.menu{display:flex;gap:28px;font-size:15px;font-weight:600}
.menu a{opacity:.9;padding:6px 0;border-bottom:2px solid transparent}
.menu a:hover{opacity:1;border-color:var(--green)}
.lang{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7);border-radius:999px;padding:7px 16px;font:700 14px "IBM Plex Sans Arabic",Manrope,sans-serif;cursor:pointer}
.lang:hover{background:#fff;color:var(--navy)}
@media (max-width:900px){.menu{display:none}}

.hero{position:relative;min-height:100vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;
  background:linear-gradient(100deg,rgba(11,31,58,.96) 0%,rgba(11,31,58,.75) 45%,rgba(137,207,240,.25) 100%),
  radial-gradient(circle at 80% 30%,#1b6fa8 0,#0b1f3a 60%)}
html[dir="rtl"] .hero{background:linear-gradient(260deg,rgba(11,31,58,.96) 0%,rgba(11,31,58,.75) 45%,rgba(137,207,240,.25) 100%),
  radial-gradient(circle at 20% 30%,#1b6fa8 0,#0b1f3a 60%)}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.spin{transform-origin:930px 290px;animation:spin 60s linear infinite}
.spin.rev{animation-direction:reverse;animation-duration:90s}
.float{animation:float 9s ease-in-out infinite}
.float2{animation:float 12s ease-in-out infinite reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite}
.pulse:nth-child(3){animation-delay:.6s}.pulse:nth-child(4){animation-delay:1.2s}.pulse:nth-child(5){animation-delay:1.8s}
.flow{stroke-dasharray:14 10;animation:flow 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-24px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes flow{to{stroke-dashoffset:-240}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
.ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;float:inline-end}
.ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sk{width:34px;height:34px;border-radius:9px;background:#eef7fc;display:grid;place-items:center;flex:none}
.sk svg{width:18px;height:18px;stroke:var(--deep);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
html[dir="rtl"] .hero svg.bg{transform:scaleX(-1)}
.hero .wrap{position:relative;padding-bottom:110px;padding-top:160px;width:100%}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:22px}
.kicker::before{content:"";width:36px;height:3px;background:var(--green)}
.hero h1{font-size:clamp(40px,7.5vw,92px);line-height:1.05;font-weight:800;letter-spacing:-.02em;max-width:900px}
.hero p{font-size:clamp(18px,2.2vw,24px);max-width:680px;margin:26px 0 40px;color:rgba(255,255,255,.85)}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font-weight:700;font-size:15px;transition:.2s}
.btn.solid{background:var(--blue);color:var(--navy)}
.btn.solid:hover{background:#a6dcf5}
.btn.ghost{border:2px solid rgba(255,255,255,.7);color:#fff}
.btn.ghost:hover{background:#fff;color:var(--navy)}
.arrow::after{content:"→";font-size:18px}
html[dir="rtl"] .arrow::after{content:"←"}

.band{background:var(--navy);color:#fff}
.band .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.band .s{padding:38px 24px;border-inline-start:1px solid rgba(255,255,255,.12)}
.band .s:first-child{border-inline-start:0}
.band b{display:block;font-size:44px;font-weight:800;line-height:1.1}
.band b em{font-style:normal;color:var(--green)}
.band small{color:rgba(255,255,255,.7);font-size:14px}

section{padding:110px 0}
section.alt{background:var(--soft)}
.label{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin-bottom:12px}
html[lang="ar"] .label,html[lang="ar"] .kicker,html[lang="ar"] .subhead,html[lang="ar"] .cgrid small{letter-spacing:0;font-size:15px}
h2{font-size:clamp(32px,4.5vw,52px);line-height:1.15;font-weight:800;color:var(--navy);letter-spacing:-.01em;max-width:700px;margin-bottom:48px}
.intro{font-size:20px;color:var(--muted);max-width:820px}

.split{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:center}
.split h2{margin-bottom:24px}
.visual{aspect-ratio:4/3;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(145deg,#0b1f3a,#0b3a63 55%,#89cff0);box-shadow:0 30px 60px -20px rgba(11,31,58,.45)}
.visual svg{position:absolute;inset:0;width:100%;height:100%}
.visual span{position:absolute;inset-inline-start:32px;bottom:28px;color:#fff;font-weight:700;font-size:20px;max-width:70%;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.skills div::before{display:none}
@media (max-width:900px){.split{grid-template-columns:1fr;gap:40px}}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border-radius:6px;overflow:hidden;border:1px solid var(--line);transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(11,31,58,.12)}
.card .head{padding:28px 30px 22px;color:#fff}
.card:nth-child(1) .head{background:linear-gradient(120deg,#0b1f3a,#123b6b)}
.card:nth-child(2) .head{background:linear-gradient(120deg,#0b1f3a,#005d8f)}
.card:nth-child(3) .head{background:linear-gradient(120deg,#0b3a63,#1f5f9a)}
.card:nth-child(4) .head{background:linear-gradient(120deg,#1f5f9a,#3d86c6)}
.yr{display:inline-block;font-size:13px;font-weight:700;background:rgba(255,255,255,.16);padding:4px 12px;border-radius:999px;margin-bottom:14px}
.card h3{font-size:22px;font-weight:800;line-height:1.3}
.card .org{font-size:15px;opacity:.85;margin-top:6px}
.card ul{padding-block:24px 30px;padding-inline:48px 30px;color:var(--muted)}
.card li{margin:8px 0}
.card li::marker{color:var(--green)}

.subhead{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin:8px 0 18px}
.edu{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--navy);margin-bottom:56px}
.edu div{padding-block:32px;padding-inline-end:28px;border-bottom:1px solid var(--line)}
.edu .y{font:800 40px Manrope,sans-serif;color:var(--deep);line-height:1}
.edu h4{font-size:19px;color:var(--navy);margin:14px 0 4px}
.edu p{color:var(--muted);font-size:15px}
@media (max-width:820px){.edu{grid-template-columns:1fr}}

.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px;background:var(--line);border:2px solid var(--line)}
.skills div{background:#fff;padding:24px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:12px}
.skills div::before{content:"";width:10px;height:10px;background:var(--green);border-radius:2px;flex:none}

.contact{background:linear-gradient(110deg,var(--navy) 0%,#004b7a 60%,var(--blue) 100%);color:#fff}
.contact h2{color:#fff;margin-bottom:0}
.contact .label{color:var(--green)}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:48px}
.cgrid a{padding:26px;border:1px solid rgba(255,255,255,.25);border-radius:6px;transition:.2s;overflow-wrap:anywhere}
.cgrid a:hover{background:rgba(255,255,255,.1);border-color:var(--green)}
.cgrid small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800;margin-bottom:8px}
.ltr{direction:ltr;unicode-bidi:isolate}
@media (max-width:900px){.cgrid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.cgrid{grid-template-columns:1fr}}
footer{background:#071427;color:rgba(255,255,255,.6);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:28px;padding-bottom:28px}
</style>
</head>

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12}) : null;
function observe(){
  document.querySelectorAll("section h2, .split .visual, .card, .edu, .skills, .cgrid").forEach(el => {

}
